
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | Signup</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="signup-container">
    <div class="signup-card">
      <div class="logo">S</div>

      <h1>Create your account</h1>
      <p class="subtitle">Join us today. It only takes a minute.</p>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            autocomplete="name"
            required
          />
          <small class="error" id="nameError"></small>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          />
          <small class="error" id="emailError"></small>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-password"
              data-target="password">Show</button>
          </div>
          <div class="strength-track">
            <div id="strengthBar"></div>
          </div>
          <small id="strengthText">Use 8+ characters with letters and numbers.</small>
          <small class="error" id="passwordError"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="confirmPassword"
              placeholder="Re-enter your password"
              autocomplete="new-password"
              required
            />
            <button type="button" class="toggle-password"
              data-target="confirmPassword">Show</button>
          </div>
          <small class="error" id="confirmError"></small>
        </div>

        <label class="terms">
          <input type="checkbox" id="terms" />
          <span>I agree to the Terms of Service and Privacy Policy.</span>
        </label>
        <small class="error" id="termsError"></small>

        <button type="submit" class="submit-btn">Create account</button>

        <p id="successMessage" class="success" role="status"></p>
      </form>

      <p class="login-link">
        Already have an account? <a href="#" id="loginLink">Log in</a>
      </p>
    </div>
  </main>
</body>
</html>
